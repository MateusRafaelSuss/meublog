<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <p>Home</p>
        <p>Detalhes</p>
        <p>Titulo</p>
    </nav>
    
    <p>biblioteca</p>

    <form id="meu-form">
        <div>
            <label for="email">Digite seu email</label>
            <input type="email" id="email" required>
        </div>
        <div>
            <label for="message">Mande uma mensagem:</label>
            <textarea id="message" required></textarea>
        </div>
        <button type="submit">Send</button>
    </form>

    <div id="resposta-ia"></div>

    <script>
        const form = document.getElementById('meu-form');
        const textoPost = document.getElementById('resposta-ia');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            textoPost.innerText = "🤖 A IA está pensando...";

            try {
                const response = await fetch('https://sussmateus.app.n8n.cloud/webhook/a7c70034-31a6-4a81-9adb-bc4365152690', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        message: document.getElementById('message').value
                    })
                });

                if (!response.ok) throw new Error('Erro na requisição');

                const text = await response.text();
                textoPost.innerHTML = marked.parse(text);
            } catch (error) {
                textoPost.innerText = "❌ Ocorreu um erro ao obter a resposta.";
                console.error(error);
            }
        });
    </script>
</body>
</html>
